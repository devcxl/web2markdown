<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web2Markdown</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>Web2Markdown</h1>
        <p>Extract the current article as Markdown.</p>
      </header>

      <section class="actions">
        <button id="copy" type="button" disabled>Copy Markdown</button>
      </section>

      <p id="status" class="status" role="status">Converting current page...</p>
      <textarea id="output" readonly placeholder="Markdown output will appear here."></textarea>
    </main>
  </body>
</html>
